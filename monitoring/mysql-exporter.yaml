fullnameOverride: crewmeister-mysql-exporter
serviceMonitor:
  enabled: true
  additionalLabels:
    release: crewmeister-monitoring
  interval: 15s
collectors:
  global_status: true
  global_variables: true
  slave_status: false
  info_schema.tables: false
  info_schema.innodb_cmp: false
  info_schema.innodb_cmpmem: false
  info_schema.query_response_time: false
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
