name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_DATABASE: challenge
          MYSQL_USER: crewmeister
          MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_INITDB_SKIP_TZINFO: '1'
        ports:
          - 127.0.0.1::3306
        options: >-
          --health-cmd="MYSQL_PWD=$MYSQL_PASSWORD mysqladmin --protocol=TCP --host=127.0.0.1 --user=$MYSQL_USER status --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=60
          --health-start-period=20s
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run MySQL integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports['3306'] }}/challenge
          SPRING_DATASOURCE_WRITER_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports['3306'] }}/challenge
          SPRING_DATASOURCE_USERNAME: crewmeister
          SPRING_DATASOURCE_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: target/surefire-reports/
          overwrite: true
          if-no-files-found: warn
          retention-days: 7

      - name: Analyze with SonarCloud when configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo '::notice::SonarCloud is configured without SONAR_TOKEN; skipping analysis.'
            exit 0
          fi
          bash ./mvnw --batch-mode --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" "-Dsonar.organization=$SONAR_ORGANIZATION"

  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          mkdir -p reports
          docker run --rm --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --mount "type=bind,source=$PWD/reports,target=/reports" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git /repo --log-opts=--all --redact=100 --report-format=json --report-path=/reports/gitleaks.json

      - name: Upload redacted secret scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan
          path: reports/gitleaks.json
          overwrite: true
          if-no-files-found: warn
          retention-days: 7

  infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install Helm
        env:
          HELM_VERSION: 4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          archive="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://get.helm.sh/${archive}" --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$HELM_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"

      - name: Validate the application chart
        run: |
          helm lint helm/crewmeister-app --strict
          helm lint helm/crewmeister-app --values helm/crewmeister-app/values-local.yaml --strict
          helm template crewmeister-app helm/crewmeister-app --namespace crewmeister > "$RUNNER_TEMP/chart-default.yaml"
          helm template crewmeister-app helm/crewmeister-app --namespace crewmeister \
            --values helm/crewmeister-app/values-local.yaml > "$RUNNER_TEMP/chart-local.yaml"
          helm lint helm/crewmeister-app --set serviceMonitor.enabled=true --strict
          helm template crewmeister-app helm/crewmeister-app --namespace crewmeister \
            --set serviceMonitor.enabled=true > "$RUNNER_TEMP/chart-monitored.yaml"
          helm lint helm/crewmeister-app --values helm/crewmeister-app/values-aws.yaml --strict
          helm template crewmeister-app helm/crewmeister-app --namespace crewmeister \
            --values helm/crewmeister-app/values-aws.yaml \
            --set-string image.tag=0000000000000000000000000000000000000000 > "$RUNNER_TEMP/chart-aws.yaml"

      - name: Validate monitoring configuration
        run: |
          python3 -m json.tool monitoring/dashboards/crewmeister.json >/dev/null
          helm template crewmeister-monitoring kube-prometheus-stack \
            --repo https://prometheus-community.github.io/helm-charts --version 92.17.0 \
            --namespace crewmeister --values monitoring/values.yaml \
            --set grafana.admin.existingSecret=crewmeister-grafana-admin > "$RUNNER_TEMP/monitoring.yaml"
          helm template crewmeister-mysql-exporter prometheus-mysql-exporter \
            --repo https://prometheus-community.github.io/helm-charts --version 2.16.0 \
            --namespace crewmeister --values monitoring/mysql-exporter.yaml \
            --set mysql.existingPasswordSecret.name=crewmeister-database \
            --set mysql.existingPasswordSecret.key=password > "$RUNNER_TEMP/mysql-exporter.yaml"

      - name: Render AWS platform charts without a cluster
        run: |
          helm template crewmeister-mysql mysql \
            --repo https://groundhog2k.github.io/helm-charts/ --version 3.1.5 \
            --namespace crewmeister --values terraform/platform/mysql-values.yaml \
            --values terraform/aws/platform/mysql-values.yaml \
            --set settings.existingSecret=crewmeister-mysql-root \
            --set userDatabase.existingSecret=crewmeister-database > "$RUNNER_TEMP/mysql-aws.yaml"
          helm template crewmeister-monitoring kube-prometheus-stack \
            --repo https://prometheus-community.github.io/helm-charts --version 92.17.0 \
            --namespace crewmeister --values monitoring/values.yaml \
            --values terraform/aws/platform/monitoring-values.yaml \
            --set grafana.admin.existingSecret=crewmeister-grafana-admin > "$RUNNER_TEMP/monitoring-aws.yaml"
          helm template aws-load-balancer-controller aws-load-balancer-controller \
            --repo https://aws.github.io/eks-charts --version 3.6.2 --namespace kube-system \
            --set clusterName=crewmeister-aws --set region=eu-north-1 --set vpcId=vpc-validation-only \
            --set replicaCount=1 --set enableShield=false --set enableWaf=false --set enableWafv2=false \
            > "$RUNNER_TEMP/controller-aws.yaml"

      - name: Validate every Terraform stage
        run: |
          terraform fmt -check -recursive terraform
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/terraform-plugin-cache"
          for stage in cluster platform aws/bootstrap aws/cluster aws/platform; do
            terraform -chdir="terraform/$stage" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="terraform/$stage" validate
          done

      - name: Parse AWS PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/aws-*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          & ./scripts/tests/aws-guards.ps1

      - name: Test AWS safety guards without credentials
        run: bash scripts/tests/aws-guards.sh

      - name: Check Bash syntax
        run: |
          for script in scripts/*.sh scripts/tests/*.sh; do
            bash -n "$script"
          done

  image:
    name: Build and scan image
    needs: [test, infrastructure, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the application image
        run: |
          docker build --tag "crewmeister-ci:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Restore vulnerability databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/trivy-cache/trivy/db
            ${{ runner.temp }}/trivy-cache/trivy/java-db
          key: trivy-0.76.1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-0.76.1-${{ runner.os }}-

      - name: Scan OS and Java dependencies
        run: |
          mkdir -p reports "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            --mount "type=bind,source=$PWD/reports,target=/reports" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/root/.cache" \
            "$TRIVY_IMAGE" image --scanners vuln --timeout 20m --no-progress \
            --format json --output /reports/trivy.json --exit-code 0 "crewmeister-ci:$GITHUB_SHA"
          docker run --rm --mount "type=bind,source=$PWD/reports,target=/reports" \
            "$TRIVY_IMAGE" convert --scanners vuln --format table --output /reports/trivy.txt /reports/trivy.json
          docker run --rm --mount "type=bind,source=$PWD/reports,target=/reports" \
            "$TRIVY_IMAGE" convert --format cyclonedx --output /reports/sbom.cdx.json /reports/trivy.json

      - name: Summarize vulnerability findings
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter

          with open("reports/trivy.json", encoding="utf-8") as report:
              results = json.load(report).get("Results") or []
          counts = Counter(v.get("Severity", "UNKNOWN") for result in results
                           for v in (result.get("Vulnerabilities") or []))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Trivy vulnerability report\n\n")
              summary.write("Findings are report-only; scanner errors fail CI. Full JSON and text reports are attached.\n\n")
              summary.write("| Severity | Findings |\n| --- | ---: |\n")
              for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
                  summary.write(f"| {severity} | {counts[severity]} |\n")
          PY

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-reports
          path: reports/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

      - name: Export the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          docker save --output "$RUNNER_TEMP/publish/image.tar" "crewmeister-ci:$GITHUB_SHA"

      - name: Transfer the scanned image to the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanned-image
          path: ${{ runner.temp }}/publish/image.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish image
    needs: [test, infrastructure, secrets, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanned-image
          path: ${{ runner.temp }}/publish
          digest-mismatch: error

      - name: Publish the existing image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker load --input "$RUNNER_TEMP/publish/image.tar"
          docker tag "crewmeister-ci:$GITHUB_SHA" "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm anonymous reviewer access
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! docker --config "$RUNNER_TEMP/anonymous-docker" manifest inspect "$image" >/dev/null; then
            echo '::error::Set the GHCR package visibility to public in Package settings, then rerun this job.'
            exit 1
          fi

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
